<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src raha: https: data: 'self'; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Raha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="chrome">
    <aside id="sidebar" aria-label="Folders and tabs"></aside>
    <header id="topbar" aria-label="Navigation"></header>
    <main id="content" aria-label="Tab grid"></main>
    <footer id="livebar" aria-label="Running tabs"></footer>
  </div>
  <div id="settings"></div>
  <div id="history"></div>
  <div id="organize"></div>
  <div id="prompt"></div>
  <div id="runaway"></div>
  <div id="ctxmenu"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>

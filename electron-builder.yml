# electron-builder configuration. Used by `npm run dist` locally and by
# .github/workflows/release.yml on tag push (which publishes to the GitHub
# Release). Docs: https://www.electron.build
appId: io.github.rahabrowser.raha
productName: Raha
copyright: Copyright © 2026 Amir Basareh — GPL-3.0-only

directories:
  buildResources: build
  output: release

# Declare http/https handling so the OS lists Raha as a default-browser
# candidate (macOS: CFBundleURLTypes; Windows/Linux: protocol associations).
# Without this, "set as default browser" cannot even be offered.
protocols:
  - name: Web URL
    schemes: [http, https]
    role: Viewer

# The app runs straight from source — no build step, so ship src/ verbatim.
# NOTE: these globs are not the whole story. electron-builder also packs
# production dependencies automatically, so the asar additionally contains
# node_modules/ with electron-updater + its 15 transitive packages (ADR-0008).
# Confirm what actually shipped with:
#   npx asar list release/mac/Raha.app/Contents/Resources/app.asar | head
# tests/ and docs/ are excluded by omission — do not add a broad glob.
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"

# Licence files beside the app, outside the asar, on every OS (0.3.2): the
# GPL for Raha itself, the notices for the packages and filter lists inside
# it (THIRD_PARTY_NOTICES.txt, made by `npm run notices`; checked by
# tests/unit/notices.test.js), and Electron's licence and Chromium's
# credits, which electron-builder leaves out of the macOS bundle.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html

asar: true

# Electron fuses: capabilities burned OFF in shipped binaries (dev/test runs
# from node_modules are unaffected). Verified by the "fuses hold" step in
# .github/workflows/release.yml — if you remove one here, that step goes red.
electronFuses:
  # The binary must never act as a generic Node runtime for whatever set
  # ELECTRON_RUN_AS_NODE in the environment (classic living-off-the-land
  # vector; we don't use process.fork so nothing needs it).
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Cookies encrypted at rest with the OS keychain.
  enableCookieEncryption: true
  # App code loads only from the signed/packed asar, and (where the OS
  # supports it) the asar hash is validated at startup.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Renderers get no special file:// powers (raha:// is served by main).
  grantFileProtocolExtraPrivileges: false
  # macOS: re-sign ad-hoc after flipping fuses so the binary stays runnable.
  resetAdHocDarwinSignature: true

linux:
  target:
    - AppImage
    - deb
  category: Network
  synopsis: A calm, private browser where you control which tabs may spend RAM and CPU.
  maintainer: Amir Basareh <basareh@duck.com>

deb:
  # electron-builder's default list (app-builder-lib FpmTarget.js), plus
  # ALSA: Chromium links libasound.so.2, so without it the binary does not
  # start on a desktop without sound packages (stock Ubuntu 24.04). Ubuntu
  # 24.04 renamed the package libasound2t64 and left `libasound2` a virtual
  # name that an OSS shim without ALSA's symbols also provides, so the real
  # 24.04 package comes first and the fallback (22.04, Debian 12) is
  # versioned, which the shim cannot satisfy. Setting `depends` replaces the
  # default list, so keep it whole.
  # https://www.electron.build/linux#debian-package-options
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2 (>= 1.0.17)

win:
  target:
    - nsis
nsis:
  # Pin the installer name (default is "Raha Setup 0.1.0.exe", which GitHub
  # rewrites to dots) so site/index.html can link to it verbatim — checked by
  # scripts/check-site.mjs against package.json version.
  artifactName: Raha-Setup-${version}.${ext}
  oneClick: true
  deleteAppDataOnUninstall: false

mac:
  # Both architectures: GitHub's macos runners are Apple Silicon, and a bare
  # target list would ship arm64-only installers that no Intel Mac can run.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.productivity
  # R-108 signing. There is deliberately NO `identity:` key here: setting it to
  # null hard-disables signing, and electron-builder already does the right
  # thing on its own — it signs when CSC_LINK + CSC_KEY_PASSWORD are in the
  # environment and skips (falling back to the ad-hoc re-sign below) when they
  # are not. A cert-less `npm run dist` therefore still produces the same
  # runnable, unsigned app it always did.
  hardenedRuntime: true
  # Gatekeeper assessment of the *unsigned* local build would always fail;
  # release.yml asserts spctl on the signed artifact instead.
  gatekeeperAssess: false
  # Rendered by the beforePack hook — see scripts/mac-entitlements.mjs.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarize when APPLE_API_KEY/_ID/_ISSUER are set. NOTE: with them missing,
  # app-builder-lib only WARNS and skips, so a green build is not proof of
  # notarization — release.yml has an explicit stapler/spctl guard for that.
  notarize: true
  # Why the app asks for these, shown in the macOS consent dialogs.
  extendInfo:
    NSCameraUsageDescription: A site you are visiting asked to use the camera. Raha always asks you first.
    NSMicrophoneUsageDescription: A site you are visiting asked to use the microphone. Raha always asks you first.
    NSLocationWhenInUseUsageDescription: A site you are visiting asked for your location. Raha always asks you first.
    NSAppleEventsUsageDescription: Raha reads the open tabs of another browser you pick, so it can import them.

# Renders build/entitlements.mac.plist from the committed .in template and
# $APPLE_TEAM_ID before packaging. No-op on Linux/Windows.
beforePack: ./scripts/mac-entitlements.mjs

publish:
  provider: github
